name: benchmark-flywheel

# Queue overlapping runs (cron + workflow_dispatch) so they don't race the
# rolling tournament-predictions / benchmark-data artifacts. cancel-in-progress
# is false because each run produces real data we want to keep.
concurrency:
  group: benchmark-flywheel
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 2 * * *'  # daily at 02:30 UTC (aims for Slack post before 11:00 IST)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of days to look back for data'
        required: false
        default: '7'
      max_markets:
        description: 'Max markets per platform for tournament'
        required: false
        default: '45'
      created_within_hours:
        description: 'Polymarket: only markets created within the last N hours; 0 disables the cutoff (use 0 once for a backfill run). 6 days by default so slow-to-liquidity markets and missed runs are still picked up.'
        required: false
        default: '144'
      tools:
        description: 'Comma-separated subset of tools (default: every key in benchmark/tournament_tools.json)'
        required: false
        default: ''
      notify_slack:
        description: 'Post summary to Slack'
        required: false
        type: boolean
        default: true
      force_rebuild:
        description: 'Discard cached scores and rebuild from fresh production logs'
        required: false
        type: boolean
        default: false
      rolling_window_days:
        description: 'Trailing-window length (days) for the Current/Prev rolling comparison sections'
        required: false
        default: '7'
      run_triage:
        description: 'Run the tool-improvement triage step at the end (default: true). Cron always runs it; manual dispatch can flip it off to skip the step.'
        required: false
        type: boolean
        default: true
      use_mech_analytics_rows:
        description: 'Route scorer + analyze through mech-analytics HTTP API instead of local production logs. Default on after the mech-analytics cutover; flip off here or via the repo variable USE_MECH_ANALYTICS_ROWS=false as a rollback lever. Non-empty value overrides the repo variable; empty defers to it.'
        required: false
        type: choice
        options: ['', 'true', 'false']
        default: ''
      resolution_lag_days:
        description: 'Days to reach back beyond the start of the current calendar month when the mech-analytics rebuild fallback runs. Default 0 fetches only the current month, leaving prior months in scores_history.jsonl verbatim. Each 31-day increment pulls one more full calendar month into the fetch and overwrites that month row with a mech-analytics-derived summary. Only used on the rebuild fallback path; the incremental path ignores it.'
        required: false
        type: string
        default: '0'

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Production benchmark
  # Depends on tournament-run so tournament_scored.jsonl is available for
  # the scorer/analyze steps to merge into the unified report.
  # -----------------------------------------------------------------------
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [tournament-run]
    if: always() && !cancelled()
    # issues: write is needed by the Tool-improvement triage step at the
    # end of this job; the default github.token has contents: read only.
    # actions: read is needed by `Download previous benchmark data` (the
    # action calls the Actions REST API to locate the prior run's
    # benchmark-data artifact carrying tool_improvement_triage_state.json,
    # scores.json, and the fetch cursor) and by `Resolve report artifact
    # URL` (gh api .../actions/runs/.../artifacts). Without it those calls
    # 403 silently (both wrap continue-on-error), state restore fails
    # every day, and duplicate-suppression breaks.
    # If TOOL_IMPROVEMENT_GH_TOKEN secret is set, it overrides github.token
    # for that step (lets the issue be authored by a dedicated bot account
    # rather than github-actions[bot]); these permissions still apply.
    permissions:
      contents: read
      issues: write
      actions: read
    # Drives both the Python ROLLING_WINDOW_DAYS constant (read at import
    # time in benchmark/analyze.py) and the --period-days flag passed to
    # the scorer below, keeping the report and the scoring step in sync.
    env:
      BENCHMARK_ROLLING_WINDOW_DAYS: ${{ github.event.inputs.rolling_window_days || '7' }}
      # Feature flag: when 'true', scorer's --rebuild path and analyze.py
      # source their rows from mech-analytics instead of the local log
      # files. Default ON after the mech-analytics cutover
      # (valory-xyz/mech-analytics#36 + placeholder repair + equivalence
      # job pin holding row-for-row score identity). Set the repo
      # variable USE_MECH_ANALYTICS_ROWS=false to route back to the
      # subgraph+IPFS path as a rollback lever. See
      # docs/consumer_migration.md §6 in valory-xyz/mech-analytics.
      USE_MECH_ANALYTICS_ROWS: ${{ github.event.inputs.use_mech_analytics_rows || vars.USE_MECH_ANALYTICS_ROWS || 'true' }}

    steps:
      # fetch-depth: 0 so `git show <tag>:packages/packages.json` works for
      # every historical release — required by benchmark/release_map.py.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests scipy numpy

      # Normalize USE_MECH_ANALYTICS_ROWS to a single lowercase,
      # whitespace-trimmed form for every downstream shell + Python
      # comparison. Shell `[ "$X" = "true" ]` and YAML `if:` are
      # case-sensitive exact-match; python's `scoring_primitives.
      # parse_truthy_env` strips + lowercases. Without this
      # normalization, a repo Variable set to `True` / `TRUE` /
      # `true ` splits the two sides — shell reads off, Python reads
      # on — which lets stale ROI outputs get posted as live when the
      # HTTP fetch fails (Clear stale ROI outputs step is shell-gated
      # so it doesn't run, roi_sim main() takes the mech-analytics
      # branch anyway, continue-on-error masks any endpoint failure,
      # yesterday's roi_results.json survives).
      - name: Normalize USE_MECH_ANALYTICS_ROWS
        run: |
          normalized="$(printf '%s' "$USE_MECH_ANALYTICS_ROWS" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          echo "USE_MECH_ANALYTICS_ROWS=$normalized" >> "$GITHUB_ENV"
          echo "Normalized USE_MECH_ANALYTICS_ROWS='$normalized'"

      # Download previous run's state + scores (if they exist)
      - name: Download previous benchmark data
        uses: dawidd6/action-download-artifact@09f2f74827fd3a8607589e5ad7f9398816f540fe  # v3
        with:
          name: benchmark-data
          path: benchmark/
          workflow: benchmark_flywheel.yaml
          if_no_artifact_found: warn
        continue-on-error: true

      # The previous-run artifact now carries tournament_scored.jsonl (it
      # ships in benchmark-data for the coding agent). The TRIAGE, however,
      # must only ever see the FRESH copy from today's tournament job: if
      # that download fails (it is continue-on-error), a stale restored
      # copy would make T-1 windows score yesterday's shadow rows as if
      # current (fail-stale). Purge it here; the fresh download below
      # re-creates it, and its absence correctly disables the T-1 tier.
      - name: Drop stale tournament rows from the restored artifact
        run: rm -f benchmark/results/tournament_scored.jsonl

      # Self-healing backfill: delivery rows are occasionally written to
      # the daily shards before their response is available upstream
      # (indexer lag or transient subgraph failures), landing with
      # p_yes=null and prediction_parse_status="missing_fields". The fetch
      # is append-only (row_id dedup), so those rows are never re-fetched.
      # This step requeries the marketplace subgraphs for such rows and
      # repairs the shards in place once the data exists; when nothing is
      # repairable yet the step is a no-op (repaired=0). It writes
      # repaired=<n> AND backfill_error=<true|false> to the step output,
      # both consumed by the force-rebuild path below (backfill_error=true
      # means a batch/probe/shard-rewrite failed partway, or a shard was
      # unreadable/undecodable, so some rows may have been repaired but we
      # cannot tell which -> force a rebuild). skipped_lines=<n> is also
      # emitted (total malformed lines quarantined) for the flywheel
      # summary. A hard kill of this step (timeout/OOM/cancel) writes no
      # outputs at all; the force-rebuild path additionally gates on
      # steps.backfill.outcome == 'failure' to cover that case.
      # --max-shard-age-days bounds the scan so legacy/unhealable shards are
      # not re-globbed and re-queried forever as logs/ grows.
      # continue-on-error: a subgraph failure must not kill the flywheel.
      # Flag gate: with USE_MECH_ANALYTICS_ROWS=true the subgraph path
      # is being deprecated and the backfill has nothing to repair
      # (logs/ isn't being written). Running it anyway can flip
      # backfill_error=true against degrading subgraphs, which cascades
      # into the wipe step below deleting scores_history.jsonl.
      - name: Backfill null tool responses (self-healing)
        id: backfill
        if: env.USE_MECH_ANALYTICS_ROWS != 'true'
        continue-on-error: true
        run: python -m benchmark.datasets.backfill_responses --max-shard-age-days 120

      # Tournament-scored data from the tournament-run job. Used as input
      # to scorer (--tournament-input) so the per-(tool, version, mode)
      # breakdown shows up in the unified report.
      - name: Download tournament scored data
        uses: actions/download-artifact@v4
        with:
          name: tournament-predictions
          path: benchmark/results/
        continue-on-error: true

      # force_rebuild semantics: wipe ALL derived scoring state as a set
      # (scores.json, scores_history.jsonl, scored_row_ids.json) AND the
      # fetch cursor (.fetch_state.json) so the subsequent fetch pulls
      # the full lookback window and the Score step rebuilds from raw
      # logs without stale dedup or cursor state poisoning the result.
      # Before the include-hidden-files fix .fetch_state.json was never
      # persisted so deleting it here was a no-op; now that it rides in
      # the artifact, force_rebuild must explicitly clear it or the
      # rebuild runs against an empty log dir.
      # Also fires when the backfill step above repaired rows: those rows
      # were previously counted as invalid inside scored_row_ids.json and
      # the scores.json accumulators, so only a full rebuild rescores them
      # -- an incremental update would dedup them away as already-scored.
      # backfill_error=='true' also forces the rebuild: the backfill may
      # have persisted some repairs before failing partway (a subgraph
      # batch/probe failure, an unreadable/undecodable shard, or a shard
      # rewrite), and we cannot tell which rows changed, so a full rebuild
      # is the only safe way to rescore them.
      # steps.backfill.outcome == 'failure' is a THIRD trigger for the
      # harness-boundary kills that custom outputs cannot report: a timeout,
      # OOM, cancel, or a pre-try argparse exit terminates the process
      # before backfill_error/repaired are ever written, and an unset output
      # reads as '' (failing both '> 0' and "== 'true'"). GitHub Actions
      # always sets .outcome even under continue-on-error, so gating on it
      # too means a crash after partial repairs still forces the rebuild
      # rather than leaving the scores permanently desynced.
      # Flag gate: when USE_MECH_ANALYTICS_ROWS=true, preserve
      # scores_history.jsonl. The mech-analytics rebuild path only fetches
      # a trailing window and cannot repopulate historical snapshots on
      # its own; deleting history here would silently lose prior months'
      # trend rows. The rebuild path unlinks scores.json itself when it
      # needs a fresh accumulator, so wiping scores.json + fetch state
      # from CI on the flag-on path is redundant but harmless. History
      # is the only line we must not cross.
      # On flag-on, the mech-analytics rebuild handles its own snapshot +
      # unlink of scores.json. Wiping it here would defeat the pre-wipe
      # month snapshot (rebuild reads scores.json to detect month rollover).
      - name: Clear cached scores (force rebuild)
        if: github.event.inputs.force_rebuild == 'true' || steps.backfill.outputs.repaired > 0 || steps.backfill.outputs.backfill_error == 'true' || steps.backfill.outcome == 'failure'
        run: |
          rm -f benchmark/datasets/.fetch_state.json
          if [ "${USE_MECH_ANALYTICS_ROWS}" != "true" ]; then
            rm -f benchmark/results/scores.json \
                  benchmark/results/scored_row_ids.json \
                  benchmark/results/scores_history.jsonl
          fi

      # Fetch writes daily log file + calls scorer.update() inline (fast path).
      # On force_rebuild, --no-score disables the inline scoring so the
      # dedicated Score step below owns scores.json creation (slow path).
      # Inputs routed through env (not ${{ }} interpolation in the shell script)
      # to prevent workflow_dispatch shell injection — ${{ }} is macro-expanded
      # before the shell runs, so malicious input would become part of the script.
      # FORCE_REBUILD also flips to true when the backfill repaired rows,
      # errored partway, or was hard-killed at the harness boundary
      # (outcome == 'failure'), so this step and the Score step stay in
      # lockstep with the wipe above (otherwise the inline fast-path would
      # recreate scores.json from today's rows only and the Score step would
      # skip the rebuild). The condition must stay identical to the wipe
      # step's and the Score step's FORCE_REBUILD.
      - name: Fetch production data
        if: env.USE_MECH_ANALYTICS_ROWS != 'true'
        env:
          INPUT_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          FORCE_REBUILD: ${{ (github.event.inputs.force_rebuild == 'true' || steps.backfill.outputs.repaired > 0 || steps.backfill.outputs.backfill_error == 'true' || steps.backfill.outcome == 'failure') && 'true' || 'false' }}
        run: |
          NO_SCORE_FLAG=""
          if [ "$FORCE_REBUILD" = "true" ]; then
            NO_SCORE_FLAG="--no-score"
          fi
          python -m benchmark.datasets.fetch_production \
            --lookback-days "$INPUT_LOOKBACK_DAYS" \
            $NO_SCORE_FLAG

      # Slow-path scoring: run --rebuild when either (a) scores.json is
      # missing (first run, or prior run crashed before fetch's inline
      # update), or (b) force_rebuild=true (explicit full rebuild). On
      # normal runs the fast path in fetch_production already produced
      # scores.json, and this step is a no-op. The rebuild also fires when
      # the backfill step repaired rows (see the wipe step above for why).
      - name: Score
        env:
          FORCE_REBUILD: ${{ (github.event.inputs.force_rebuild == 'true' || steps.backfill.outputs.repaired > 0 || steps.backfill.outputs.backfill_error == 'true' || steps.backfill.outcome == 'failure') && 'true' || 'false' }}
          # Reachback for the mech-analytics rebuild fallback. 0 = only
          # rebuild the current calendar month, prior months in
          # scores_history.jsonl stay verbatim. Each 31-day increment
          # pulls one more calendar month into the fetch and overwrites
          # that month's history row with a mech-analytics-derived
          # summary. Read once by benchmark.scorer._resolution_lag_days.
          MECH_ANALYTICS_RESOLUTION_LAG_DAYS: ${{ github.event.inputs.resolution_lag_days || '0' }}
        run: |
          TOURNAMENT_FLAG=""
          if [ -f benchmark/results/tournament_scored.jsonl ]; then
            TOURNAMENT_FLAG="--tournament-input benchmark/results/tournament_scored.jsonl"
          fi
          # A restored accumulator written before a new field existed cannot
          # back-fill that field's running sum from its own totals, so the
          # derived metric would stay null forever on the incremental path.
          # One rebuild migrates it; the scorer stamps schema_version so this
          # is detected instead of shipping a dead column.
          STALE_SCHEMA=$(python -c "
          import json, sys
          from benchmark.scorer import SCORES_SCHEMA_VERSION
          try:
              current = json.load(open('benchmark/results/scores.json')).get('schema_version', 0)
          except Exception:
              sys.exit(0)
          print('true' if current < SCORES_SCHEMA_VERSION else 'false')
          " 2>/dev/null || echo false)
          if [ "$STALE_SCHEMA" = "true" ]; then
            echo "Restored scores.json predates the current scorer schema — forcing one rebuild"
          fi
          # Flag on: the Fetch production step is skipped, so scores.json
          # doesn't get updated incrementally by that path. Two ways to
          # produce it here:
          #   (a) ``--mech-analytics-incremental`` — merge only rows with
          #       ``computed_at >= watermark`` from the HTTP endpoint via
          #       the update() path. Fast (seconds) but requires a valid
          #       baseline: existing scores.json stamped
          #       ``source=mech_analytics`` and a
          #       ``mech_analytics_watermark.txt`` sidecar. Exit code 2
          #       signals "no baseline" and drops through to (b).
          #   (b) ``--rebuild`` — full trailing-window fetch and re-score.
          #       Slow (minutes) but bootstraps from nothing and refreshes
          #       every prior month in the fetch window.
          # A rebuild is also forced when scores.json is missing, its
          # schema is stale, or FORCE_REBUILD was set (backfill, dispatch
          # input). The subgraph rollback keeps the pre-migration
          # behavior of a no-op on normal runs (fast path already ran in
          # fetch_production).
          if [ "$USE_MECH_ANALYTICS_ROWS" != "true" ]; then
            if [ ! -f benchmark/results/scores.json ] \
               || [ "$STALE_SCHEMA" = "true" ] \
               || [ "$FORCE_REBUILD" = "true" ]; then
              echo "Running full rebuild (subgraph mode, missing scores.json / stale schema / force_rebuild)"
              python -m benchmark.scorer --rebuild \
                --logs-dir benchmark/datasets/logs/ \
                $TOURNAMENT_FLAG
            else
              echo "scores.json present and not force_rebuild — fast path already ran in fetch"
            fi
          else
            # mech-analytics mode: incremental unless we know we need a rebuild.
            NEEDS_REBUILD="false"
            if [ ! -f benchmark/results/scores.json ] \
               || [ "$STALE_SCHEMA" = "true" ] \
               || [ "$FORCE_REBUILD" = "true" ]; then
              NEEDS_REBUILD="true"
              echo "Running full rebuild (mech-analytics, missing scores.json / stale schema / force_rebuild)"
            else
              echo "Attempting mech-analytics incremental (delta rows only, seconds not minutes)"
              # Sentinel exit code 2 from the scorer means "no baseline to
              # resume from" — fall through to the rebuild below rather
              # than aborting the workflow. Any other non-zero exit
              # (endpoint unreachable, unexpected error) propagates so
              # the run fails visibly rather than silently missing rows.
              # $TOURNAMENT_FLAG deliberately omitted: the incremental
              # path fetches from mech-analytics /v1/data/scored-rows and
              # has no tournament-input partition — passing the flag
              # would suggest a tournament-input file was applied when
              # it wasn't.
              set +e
              python -m benchmark.scorer --mech-analytics-incremental
              INCR_EXIT=$?
              set -e
              if [ "$INCR_EXIT" -eq 2 ]; then
                echo "Incremental path has no baseline (exit 2); falling back to full rebuild"
                NEEDS_REBUILD="true"
              elif [ "$INCR_EXIT" -ne 0 ]; then
                echo "Incremental scorer failed with exit $INCR_EXIT"
                exit "$INCR_EXIT"
              fi
            fi
            if [ "$NEEDS_REBUILD" = "true" ]; then
              # Neither --logs-dir nor $TOURNAMENT_FLAG applies here:
              # rebuild_from_mech_analytics fetches from the HTTP endpoint
              # and has no tournament-input partition.
              python -m benchmark.scorer --rebuild
            fi
          fi

      # Incrementally merge tournament-scored rows into the cumulative
      # scores.json. Dedup by row_id (via scored_row_ids.json) makes this
      # a no-op on force_rebuild (rebuild already included --tournament-input
      # and wrote the full row_id set), and adds only genuinely new rows
      # on normal runs.
      - name: Merge tournament into cumulative scores
        if: hashFiles('benchmark/results/tournament_scored.jsonl') != ''
        run: |
          python -m benchmark.scorer \
            --update benchmark/results/tournament_scored.jsonl
        continue-on-error: true

      # Score recent periods for diff reporting. The window length
      # (--period-days, --period-offset-days) is driven by the
      # BENCHMARK_ROLLING_WINDOW_DAYS env var declared at the job level
      # so the scorer and the Python ROLLING_WINDOW_DAYS constant stay
      # in sync from a single source. These two 7d Score steps stay
      # gated to legacy mode only: under USE_MECH_ANALYTICS_ROWS=true,
      # analyze.py rebuilds and writes the same rolling_scores_<plat>
      # and prev_rolling_scores_<plat> files in-memory via
      # _write_rolling_json. Running these steps under the flag would
      # cost two extra HTTP fetches per run whose output analyze then
      # unconditionally overwrites.
      - name: Score current rolling window
        if: env.USE_MECH_ANALYTICS_ROWS != 'true'
        run: |
          TOURNAMENT_FLAG=""
          if [ -f benchmark/results/tournament_scored.jsonl ]; then
            TOURNAMENT_FLAG="--tournament-input benchmark/results/tournament_scored.jsonl"
          fi
          # --skip-tournament-output: the analyzer renders tournament
          # all-time only (never day-gated), so rolling tournament files
          # would just sit unread in results/.
          python -m benchmark.scorer \
            --period-days "$BENCHMARK_ROLLING_WINDOW_DAYS" \
            --logs-dir benchmark/datasets/logs/ \
            --output benchmark/results/rolling_scores.json \
            --skip-tournament-output \
            $TOURNAMENT_FLAG
        continue-on-error: true

      # Score the preceding non-overlapping window (offset by the same
      # window length so Current and Prev never overlap). Feeds the
      # "Δ vs Prev Nd" columns in the three-window comparison tables.
      # Same flag gate as the "current" step above and for the same
      # reason: analyze.py handles the flag-on writes itself.
      - name: Score previous rolling window (non-overlapping)
        if: env.USE_MECH_ANALYTICS_ROWS != 'true'
        run: |
          TOURNAMENT_FLAG=""
          if [ -f benchmark/results/tournament_scored.jsonl ]; then
            TOURNAMENT_FLAG="--tournament-input benchmark/results/tournament_scored.jsonl"
          fi
          python -m benchmark.scorer \
            --period-days "$BENCHMARK_ROLLING_WINDOW_DAYS" \
            --period-offset-days "$BENCHMARK_ROLLING_WINDOW_DAYS" \
            --logs-dir benchmark/datasets/logs/ \
            --output benchmark/results/prev_rolling_scores.json \
            --skip-tournament-output \
            $TOURNAMENT_FLAG
        continue-on-error: true

      # Trailing 90-day window: the digest's third column set. A fixed
      # window is a stable yardstick -- the live accumulator's span varies
      # with rollover/rebuild history, so the digest no longer reads it.
      # NOTE: the 90 below must match the digest's literal 90d labels
      # (benchmark/digest_tables.py _AT_COLUMNS + captions) -- change both.
      # Unlike the two 7d rolling steps, nothing else produces
      # trailing_scores_<platform>.json — analyze.py only writes the
      # 7d files. So this step runs under both modes: legacy scans
      # local logs; mech-analytics fetches [now-90d, now] via
      # score_period_split_by_platform_from_mech_analytics.
      # timeout-minutes here, not just continue-on-error: a job timeout
      # cancels the job, so continue-on-error never gets to absorb it and
      # every later step (Analyze, the Slack posts, triage) is skipped.
      # That is how the flywheel went dark for four nights from
      # 2026-09-01. A step budget converts a slow scorer into a failed
      # step, which continue-on-error does absorb, so the report still
      # ships minus its trailing-90d section. 10 minutes is generous: the
      # mech-analytics path runs in about 70 seconds, dominated by the
      # fetch. Raise it only if the fetch itself grows.
      - name: Score trailing 90d window
        id: trailing_90d
        timeout-minutes: 10
        run: |
          if [ "$USE_MECH_ANALYTICS_ROWS" = "true" ]; then
            python -m benchmark.scorer \
              --period-days 90 \
              --output benchmark/results/trailing_scores.json \
              --skip-tournament-output
          else
            TOURNAMENT_FLAG=""
            if [ -f benchmark/results/tournament_scored.jsonl ]; then
              TOURNAMENT_FLAG="--tournament-input benchmark/results/tournament_scored.jsonl"
            fi
            python -m benchmark.scorer \
              --period-days 90 \
              --logs-dir benchmark/datasets/logs/ \
              --output benchmark/results/trailing_scores.json \
              --skip-tournament-output \
              $TOURNAMENT_FLAG
          fi
        continue-on-error: true

      # continue-on-error keeps the job green when the step above fails
      # or trips its 10-minute budget, so the report would ship without
      # its trailing-90d section and nothing would say so. Surface that
      # as a run annotation so it is visible on the run summary.
      - name: Flag a missing trailing-90d section
        if: steps.trailing_90d.outcome == 'failure'
        run: |
          echo "::warning title=Trailing 90d scoring failed::'Score trailing 90d window' failed or hit its 10-minute budget; today's report has no trailing-90d section. See that step's log."

      - name: Analyze (Omenstrat)
        run: python -m benchmark.analyze --platform omen --include-tournament

      - name: Analyze (Polystrat)
        if: always() && !cancelled()
        run: python -m benchmark.analyze --platform polymarket --include-tournament

      # Stale ROI outputs are restored from artifact and re-rendered
      # by notify_slack as if live — delete on flag-on so the section
      # degrades to "no ROI" instead of a frozen snapshot.
      - name: Clear stale ROI outputs (flag on)
        if: always() && !cancelled() && env.USE_MECH_ANALYTICS_ROWS == 'true'
        run: |
          rm -f benchmark/results/roi_results.json \
                benchmark/results/report_roi_omen.md \
                benchmark/results/report_roi_polymarket.md

      # Companion ROI simulation over the same data the benchmark job just
      # fetched/scored. continue-on-error: the companion must not fail the
      # flywheel -- when it breaks, the daily Slack posts simply go out
      # without the ROI section (notify_slack degrades gracefully when
      # roi_results.json is missing). Under USE_MECH_ANALYTICS_ROWS=true
      # the roi_sim CLI fetches production rows from mech-analytics;
      # --logs-dir is ignored on that path so we omit it. --tournament-input
      # stays because tournament_scored.jsonl is still produced by the
      # tournament-run job (not flag-gated), and roi_sim renders tournament
      # rows in its output (mode=tournament column in the ROI Slack table).
      - name: Simulate trader ROI (companion)
        if: always() && !cancelled()
        continue-on-error: true
        run: |
          TOURNAMENT_FLAG=""
          if [ -f benchmark/results/tournament_scored.jsonl ]; then
            TOURNAMENT_FLAG="--tournament-input benchmark/results/tournament_scored.jsonl"
          fi
          if [ "$USE_MECH_ANALYTICS_ROWS" = "true" ]; then
            python -m benchmark.roi_sim $TOURNAMENT_FLAG
          else
            python -m benchmark.roi_sim \
              --logs-dir benchmark/datasets/logs/ \
              $TOURNAMENT_FLAG
          fi
          for report in benchmark/results/report_roi_omen.md benchmark/results/report_roi_polymarket.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # Upload state + scores (small, needed for next run).
      # include-hidden-files: true is required so .fetch_state.json
      # (leading dot = hidden under v4's default filter) actually ships
      # in the artifact. Without it, the incremental fetch cursor is
      # silently dropped every run and the scorer compounds double-counts.
      # Per-platform scores files each carry their own incremental-resume
      # state; dropping any of them resets that platform's accumulator.
      # tournament_scored.jsonl ships here so the coding agent's T-1
      # reproduction reads the same rows the triage scored. A stale copy
      # restored by 'Download previous benchmark data' is harmless: the
      # fresh tournament-predictions download overwrites it earlier in
      # this job, and consumers dedup by row_id under a 45d age cap.
      - name: Upload benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-data
          include-hidden-files: true
          path: |
            benchmark/datasets/.fetch_state.json
            benchmark/datasets/logs/
            benchmark/results/scores.json
            benchmark/results/scores_omen.json
            benchmark/results/scores_polymarket.json
            benchmark/results/scores_tournament.json
            benchmark/results/scores_tournament_omen.json
            benchmark/results/scores_tournament_polymarket.json
            benchmark/results/scores_history.jsonl
            benchmark/results/scored_row_ids.json
            benchmark/results/mech_analytics_watermark.txt
            benchmark/results/report_omen.md
            benchmark/results/report_polymarket.md
            benchmark/results/roi_results.json
            benchmark/results/report_roi_omen.md
            benchmark/results/report_roi_polymarket.md
            benchmark/results/tool_improvement_triage_state.json
            benchmark/results/tournament_scored.jsonl
          retention-days: 90

      - name: Resolve report artifact URL
        id: artifact-url
        run: |
          AID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="benchmark-data") | .id' 2>/dev/null || true)
          if [ -n "$AID" ]; then
            echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/$AID" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # The hashFiles() guard keeps the per-platform Slack post independent
      # of the other platform's Analyze step: if report_<platform>.md was
      # not written (because Analyze crashed before writing it), we skip
      # the Slack post for that platform rather than firing notify_slack
      # against a missing file. The neighboring platform's Slack post
      # still runs, since each step gates on its own report file.
      - name: Post Omenstrat summary to Slack
        if: always() && !cancelled() && (github.event.inputs.notify_slack != 'false') && (vars.ENABLE_SLACK_NOTIFY != 'false') && hashFiles('benchmark/results/report_omen.md') != ''
        env:
          OPENAI_API_KEY: ${{ secrets.BENCHMARK_OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.BENCHMARK_SLACK_WEBHOOK_URL }}
          REPORT_ARTIFACT_URL: ${{ steps.artifact-url.outputs.url }}
          BENCHMARK_COMPUTED_TABLES: 'true'
        run: |
          python -m benchmark.notify_slack \
            --report benchmark/results/report_omen.md \
            --platform-label Omenstrat

      - name: Post Polystrat summary to Slack
        if: always() && !cancelled() && (github.event.inputs.notify_slack != 'false') && (vars.ENABLE_SLACK_NOTIFY != 'false') && hashFiles('benchmark/results/report_polymarket.md') != ''
        env:
          OPENAI_API_KEY: ${{ secrets.BENCHMARK_OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.BENCHMARK_SLACK_WEBHOOK_URL }}
          REPORT_ARTIFACT_URL: ${{ steps.artifact-url.outputs.url }}
          BENCHMARK_COMPUTED_TABLES: 'true'
        run: |
          python -m benchmark.notify_slack \
            --report benchmark/results/report_polymarket.md \
            --platform-label Polystrat

      # Tool-improvement triage: assess every tool on the W-1 -> C-1 -> T-1
      # ladder (calendar rolling scores produced above; production count
      # windows from datasets/logs; tournament count windows from
      # results/tournament_scored.jsonl) and open a GitHub issue
      # (label: tool-improvement, title anchored 'on <platform> W-1|C-1|T-1')
      # for each fix-worthy fire -- the label routes it to the
      # tool-improvement-agent in the agent-skills monorepo. Deployment
      # decisions (merged-variant promotion, widen-sample for starved
      # tools) open deployment-review issues instead and are never
      # agent-routed. Fix-issue duplicate suppression is live-gh-list
      # based; the state-file fallback is one run STALE by construction
      # (benchmark-data uploads above, before this step runs, so the
      # artifact always carries the previous run's state). Deployment-
      # review dedup is gh-list only (fail-closed). The hashFiles() gate is defensive: if
      # either rolling file is missing (because the scorer step failed)
      # we skip triage rather than open a noisy issue against half-data.
      # Triage runs by default. The `run_triage` workflow_dispatch input
      # lets a human dispatch flip it off (run_triage=false). Cron-
      # triggered runs send an empty string for the input, so the
      # `!= 'false'` semantics fire the step on cron as the YAML
      # `default: true` advertises. No repo-level Actions Variables
      # are required. (The script still accepts --dry-run for local
      # debugging; we don't expose it as a workflow input because
      # mech-predict-test is the right place to validate behaviour
      # without filing real issues.)
      - name: Tool-improvement triage (Polystrat)
        if: always() && !cancelled() && (github.event.inputs.run_triage != 'false') && hashFiles('benchmark/results/rolling_scores_polymarket.json') != '' && hashFiles('benchmark/results/prev_rolling_scores_polymarket.json') != ''
        env:
          GH_TOKEN: ${{ secrets.TOOL_IMPROVEMENT_GH_TOKEN || github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python -m benchmark.tool_improvement_triage \
            --repo "${{ github.repository }}"

      # Daily log files uploaded separately for archival
      - name: Upload daily log archive
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-log-${{ github.run_id }}
          path: benchmark/datasets/logs/
          retention-days: 90

  # -----------------------------------------------------------------------
  # Job 2: Fetch open markets for tournament (fast, no API keys)
  # -----------------------------------------------------------------------
  tournament-fetch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Download previous open markets
        uses: dawidd6/action-download-artifact@09f2f74827fd3a8607589e5ad7f9398816f540fe  # v3
        with:
          name: tournament-markets
          path: benchmark/datasets/
          workflow: benchmark_flywheel.yaml
          if_no_artifact_found: warn
        continue-on-error: true

      # Inputs routed via env to avoid shell injection — see note in benchmark job.
      - name: Fetch Omen open markets
        env:
          INPUT_MAX_MARKETS: ${{ github.event.inputs.max_markets || '45' }}
        run: |
          python -m benchmark.datasets.fetch_open \
            --platform omen \
            --max-markets "$INPUT_MAX_MARKETS"

      - name: Fetch Polymarket open markets
        env:
          INPUT_MAX_MARKETS: ${{ github.event.inputs.max_markets || '45' }}
          INPUT_CREATED_WITHIN_HOURS: ${{ github.event.inputs.created_within_hours || '144' }}
        run: |
          python -m benchmark.datasets.fetch_open \
            --platform polymarket \
            --max-markets "$INPUT_MAX_MARKETS" \
            --min-liquidity 1000 \
            --created-within-hours "$INPUT_CREATED_WITHIN_HOURS"

      - name: Upload tournament markets
        uses: actions/upload-artifact@v4
        with:
          name: tournament-markets
          path: benchmark/datasets/open_markets.jsonl
          retention-days: 90

  # -----------------------------------------------------------------------
  # Job 3a: Check if benchmark API keys are configured
  # -----------------------------------------------------------------------
  check-secrets:
    runs-on: ubuntu-22.04
    outputs:
      has_keys: ${{ steps.check.outputs.has_keys }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.BENCHMARK_OPENAI_API_KEY }}
        run: echo "has_keys=${{ env.KEY != '' }}" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------
  # Job 3b: Run tournament predictions + score (slow, needs API keys)
  # -----------------------------------------------------------------------
  tournament-run:
    needs: [tournament-fetch, check-secrets]
    if: needs.check-secrets.outputs.has_keys == 'true'
    runs-on: ubuntu-22.04
    # GitHub-hosted runner max (6h).
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: astral-sh/setup-uv@v4

      - name: Install project dependencies
        run: uv sync

      # tournament.py + benchmark.ipfs_loader import from
      # packages.valory.skills.task_execution.utils.{apis,ipfs}. Those
      # files live in the open-autonomy `mech` upstream registry and are
      # gitignored (.gitignore: packages/valory/*), so they only land on
      # the runner after `autonomy packages sync` reads packages.json
      # and pulls them from IPFS.
      - name: Sync autonomy packages
        run: |
          uv run autonomy init --reset --author ci --remote --ipfs --ipfs-node "/dns/registry.autonolas.tech/tcp/443/https"
          uv run autonomy packages sync

      # Cache IPFS-fetched tool sources between runs. Key on
      # tournament_tools.json so a CID bump triggers a fresh fetch but
      # unchanged runs reuse cached bytes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mech-predict/tournament-tools
          key: ipfs-tools-${{ hashFiles('benchmark/tournament_tools.json') }}

      - name: Download tournament markets
        uses: actions/download-artifact@v4
        with:
          name: tournament-markets
          path: benchmark/datasets/

      - name: Download previous tournament predictions
        uses: dawidd6/action-download-artifact@09f2f74827fd3a8607589e5ad7f9398816f540fe  # v3
        with:
          name: tournament-predictions
          path: benchmark/results/
          workflow: benchmark_flywheel.yaml
          if_no_artifact_found: warn
        continue-on-error: true

      # Inputs routed via env to avoid shell injection — see note in benchmark job.
      - name: Run tournament predictions
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.BENCHMARK_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.BENCHMARK_ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.BENCHMARK_SERPER_API_KEY }}
          SEARCH_PROVIDER: ${{ secrets.BENCHMARK_SEARCH_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.BENCHMARK_GOOGLE_API_KEY }}
          GOOGLE_ENGINE_ID: ${{ secrets.BENCHMARK_GOOGLE_ENGINE_ID }}
          # vLLM endpoint + optional gateway key for the finetuned_prediction
          # tool (predict-base / predict-fine-tuned). Empty → tool's localhost
          # default, which won't resolve on the runner, so set these to run the
          # predict-* tools in the flywheel.
          VLLM_ENDPOINT: ${{ secrets.BENCHMARK_VLLM_ENDPOINT }}
          VLLM_API_KEY: ${{ secrets.BENCHMARK_VLLM_API_KEY }}
          INPUT_TOOLS: ${{ github.event.inputs.tools }}
          INPUT_MAX_MARKETS: ${{ github.event.inputs.max_markets || '45' }}
          # Wall-clock budget for the prediction loop (5h). Keeps the step
          # comfortably inside the job's 6h runner ceiling so the scoring and
          # artifact-upload steps always run — combos left over are recorded
          # as skipped_global_timeout and retried by the next daily run.
          GLOBAL_TIMEOUT_SECONDS: '18000'
        run: |
          # When INPUT_TOOLS is empty (cron run, or dispatch with the
          # default), omit --tools so tournament.py runs every tool listed
          # in tournament_tools.json — the single source of truth.
          # The two-branch form keeps "$INPUT_TOOLS" quoted at expansion
          # time so a crafted workflow_dispatch input can't shell-inject.
          if [ -n "$INPUT_TOOLS" ]; then
            uv run python -m benchmark.tournament \
              --markets benchmark/datasets/open_markets.jsonl \
              --tools "$INPUT_TOOLS" \
              --max-markets "$INPUT_MAX_MARKETS" \
              --global-timeout "$GLOBAL_TIMEOUT_SECONDS"
          else
            uv run python -m benchmark.tournament \
              --markets benchmark/datasets/open_markets.jsonl \
              --max-markets "$INPUT_MAX_MARKETS" \
              --global-timeout "$GLOBAL_TIMEOUT_SECONDS"
          fi

      - name: Score resolved predictions
        run: uv run python -m benchmark.score_tournament

      - name: Upload tournament predictions
        uses: actions/upload-artifact@v4
        with:
          name: tournament-predictions
          path: |
            benchmark/results/tournament_predictions.jsonl
            benchmark/results/tournament_scored.jsonl
          retention-days: 90

  # -----------------------------------------------------------------------
  # Job 4: Failure notification
  # The success posts live inside the benchmark job and only fire when a
  # report file exists, so a job that dies -- timeout, runner loss, an
  # unguarded step error -- posts nothing at all and reads exactly like a
  # quiet day. A cancelled job runs none of its own later steps, which is
  # why this has to be a separate job rather than a final step.
  #
  # Plain curl rather than benchmark.notify_slack: importing that module
  # pulls in the whole analyze/report stack, so it would need a checkout,
  # a Python setup and a dependency install just to send one line. This
  # job has to be the most reliable thing in the workflow.
  # -----------------------------------------------------------------------
  notify-failure:
    needs: [benchmark, tournament-fetch, check-secrets, tournament-run]
    # Same dry-run switches as the success posts, so flipping
    # notify_slack=false or ENABLE_SLACK_NOTIFY=false still silences
    # everything.
    if: always() && (github.event.inputs.notify_slack != 'false') && (vars.ENABLE_SLACK_NOTIFY != 'false')
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Post failed or cancelled jobs to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.BENCHMARK_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # toJSON(needs) carries {"<job>": {"result": "...", ...}} for
          # every job in `needs` above, so adding a job to that list is
          # the only edit a new job needs.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          broken=$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map("- \(.key): \(.value.result)")
            | join("\n")')

          if [ -z "$broken" ]; then
            echo "All upstream jobs finished clean; nothing to report."
            exit 0
          fi

          echo "Failed or cancelled jobs:"
          echo "$broken"

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::BENCHMARK_SLACK_WEBHOOK_URL is unset; skipping the Slack post."
            exit 0
          fi

          text=$(printf 'benchmark-flywheel did not complete.\n%s\n%s' "$broken" "$RUN_URL")
          jq -n --arg text "$text" '{text: $text}' > payload.json
          curl -sS --fail-with-body \
            -X POST \
            -H 'Content-Type: application/json' \
            --data @payload.json \
            "$SLACK_WEBHOOK_URL"
