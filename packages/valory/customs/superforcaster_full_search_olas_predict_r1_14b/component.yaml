name: superforcaster_full_search_olas_predict_r1_14b
author: valory
version: 0.1.0
type: custom
description: Prediction market forecasting tool. A sibling of superforcaster_full_search
  that keeps its full-page search evidence pipeline and forecasting prompt unchanged
  and swaps the forecaster for Olas-Predict-R1-14B, a fine-tuned DeepSeek-R1-Distill-Qwen-14B
  served from a self-hosted vLLM endpoint. Returns p_yes, p_no, confidence and info_utility
  for a binary prediction market question.
license: Apache-2.0
aea_version: '>=1.0.0, <2.0.0'
