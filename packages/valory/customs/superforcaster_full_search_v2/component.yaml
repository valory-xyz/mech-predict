name: superforcaster_full_search_v2
author: valory
version: 0.1.0
type: custom
description: A tool for making binary predictions on markets. Sibling of superforcaster_full_search
  that adds OpenAI Structured Outputs (Pydantic PredictionResult via beta.chat.completions.parse)
  and a mandatory word_mention_check reasoning field. Fetches full search-result pages
  (top organic results) and extracts the main article text via readability + markdownify.
  The word_mention_check field forces the model to apply event-specific base rates
  and discount circular prediction-market evidence before committing to p_yes, targeting
  systematic overconfidence on word-mention markets.
license: Apache-2.0
aea_version: '>=1.0.0, <2.0.0'
