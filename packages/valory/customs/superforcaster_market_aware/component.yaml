  superforcaster_market_aware.py: bafybeiepm22logrwiefvdt5xvciba2yjlkn6ioq7m7iz5yn3y4z6iqhnua
  tests/__init__.py: bafybeidegv7yfxpdytmvepvcqquzawanqjczrqdp2cesxxdx5vvdfmdgue
  tests/test_superforcaster_market_aware.py: bafybeia6jp3cr45mqisdbtso4ihuqpvbtjqxntxhdpyc6sl23vncq6rxou
fingerprint_ignore_patterns: []
