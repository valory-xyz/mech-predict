name: superforcaster_market_aware
author: valory
version: 0.1.0
type: custom
description: A tool for making binary predictions on prediction markets. It estimates
  the probability that a market question resolves Yes. Departing from superforcaster_full_search,
  it fetches full search-result pages (top organic results) and extracts the main
  article text via readability + markdownify, feeding the cleaned page body into the
  forecasting prompt instead of relying on Serper snippets alone, and returns its
  forecast via OpenAI Structured Outputs. It optionally accepts market context on
  the request and reports objective properties of the question alongside the forecast;
  it never advises a trade action.
license: Apache-2.0
aea_version: '>=1.0.0, <2.0.0'
