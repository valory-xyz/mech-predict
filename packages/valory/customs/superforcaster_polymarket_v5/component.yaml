name: superforcaster_polymarket_v5
author: valory
version: 0.1.0
type: custom
description: A tool for making binary predictions on markets. v5 adds utterance-question
  detection at prompt-construction stage; for Will-X-say-Y questions, an addendum
  classifies historical utterance records as TYPE B evidence and anchors base rate
  at 20-50%, preventing overconfident YES from historical frequency data.
