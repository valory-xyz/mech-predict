name: superforcaster_polymarket_v5
author: valory
version: 0.1.0
type: custom
description: A tool for making binary predictions on markets. Switches to OpenAI structured
  outputs (PredictionResult + client.beta.chat.completions.parse) so the 7-step chain-of-thought
  (including the criterion-specificity check added in v2's step 6) executes before
  p_yes is formed. max_tokens raised from 500 to 4096.
