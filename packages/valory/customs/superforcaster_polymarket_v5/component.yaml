name: superforcaster_polymarket_v5
author: valory
version: 0.1.0
type: custom
description: A tool for making binary predictions on markets using the Serper API
  and LLMs. Forces the 7-step chain-of-thought to execute before JSON emission; fixes
  the v2 regression where OUTPUT_FORMAT suppressed reasoning and max_tokens was too
  small to fit a chain-of-thought response.
