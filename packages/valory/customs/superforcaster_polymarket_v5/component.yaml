name: superforcaster_polymarket_v5
author: valory
version: 0.1.0
type: custom
description: A tool for making binary predictions on markets using the Serper API
  and LLMs. v5 adds a mandatory resolution-window screen to v4 (classify the resolution
  criterion as WINDOW vs POINT, and for a WINDOW criterion derive the probability
  from the number of chances the span contains instead of reporting whether the condition
  already holds) for systematic errors on "met at any point in a span" markets (#503).
